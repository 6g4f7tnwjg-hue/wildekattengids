const PAGES = D.pages;           // soortpagina's die af zijn
const SRC = D.sources;           // globale bronnenlijst
// hoogste score per soort (alleen uit onderzochte plekken)
const BEST = {};
SPOTS.forEach(s => s.recs.forEach(r => { if (!BEST[r.no] || r.score > BEST[r.no]) BEST[r.no] = r.score; }));
const spotMax = s => Math.max(...s.recs.map(r => r.score));
const isTop = s => s.recs.some(r => r.top);
let FILTER = 'all';
try { const f = localStorage.getItem('sg-cont'); if (f && (f === 'all' || CONTS.includes(f))) FILTER = f; } catch(e) {}

/* ---------- kleine bouwstenen ---------- */
const scoreHtml = (n, big, compact) => `<span class="score${big?' big':''}" style="--c:var(--s${n})" title="${esc(T(U.chance))} ${n}/5 · ${esc(T(U.sc[n]))}"><span class="pips" aria-hidden="true">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span><b>${compact ? `${n}/5` : `${esc(T(U.chance))} ${n} · ${esc(T(U.sc[n]))}`}</b></span>`;
const credit = cr => esc(String(cr || '').replace(/^foto:\s*/i, T(U.photoPre) + ' '));
const catName = c => T({nl:c.nl, en:c.en});
const img = (p, alt, eager) => `<img src="${esc(p.src)}" alt="${esc(alt)}" loading="${eager?'eager':'lazy'}" decoding="async">`;
const iucnHtml = code => `<span class="iucn" style="--ic:${IUCN_COL[code]||'#777'}"><b>${esc(code)}</b>${esc(T(U.iucn[code]||{nl:code,en:code}))}</span>`;
const contName = c => T(U.cont[c]);
const factsHtml = r => `<dl class="facts">
  ${T(r.season)?`<div><dt>${esc(T(U.season))}</dt><dd>${esc(T(r.season))}</dd></div>`:''}
  ${T(r.time)?`<div><dt>${esc(T(U.time))}</dt><dd>${esc(T(r.time))}</dd></div>`:''}
  ${T(r.trip)?`<div><dt>${esc(T(U.trip))}</dt><dd>${esc(T(r.trip))}</dd></div>`:''}</dl>`;
const placeLine = s => [T(s.area), T(s.country)].filter(Boolean).join(' · ');

/* ---------- kaart ---------- */
const W = 720, H = 284;
const proj = (lat, lon) => [(lon + 180) * 2, (84 - lat) * 2];
const BOX = { all:[0,0,720,284], eur:[300,18,170,96], afr:[300,80,200,170], asia:[400,30,300,170], nam:[10,10,270,140], sam:[100,110,230,175] };
function fit(b){ // houd de verhouding van de kaart vast
  let [x,y,w,h] = b; const r = W/H;
  if (w/h > r){ const nh = w/r; y -= (nh-h)/2; h = nh; } else { const nw = h*r; x -= (nw-w)/2; w = nw; }
  if (w > W){ w = W; h = H; } x = Math.max(0, Math.min(W-w, x)); y = Math.max(0, Math.min(H-h, y));
  return [x,y,w,h];
}
const GRAT = (() => { let g=''; for(let lon=-150; lon<180; lon+=30) g+=`M${(lon+180)*2},0V284`; for(let lat=60; lat>-60; lat-=30) g+=`M0,${(84-lat)*2}H720`; return g; })();
function mapSvg(opts){
  const vb = fit(opts.box), k = vb[2]/W;
  const r = Math.max(1.8, 4.4*k), sw = Math.max(.3, .9*k);
  const rng = opts.range ? `<path class="rng" d="${opts.range}" stroke-width="${.6*k}"/>` : '';
  const mks = opts.markers.map(m => {
    const [x,y] = proj(m.lat, m.lon);
    const rr = m.num ? r*1.25 : r;
    return `<g class="mk${m.sel?' sel':''}" data-id="${esc(m.id)}" tabindex="0" role="button" aria-label="${esc(m.label)}">
      <circle cx="${x}" cy="${y}" r="${rr*2.2}" fill="transparent"/>
      ${m.ring?`<circle class="ring" cx="${x}" cy="${y}" r="${rr+1.6*sw+ .8*k}" stroke-width="${sw}"/>`:''}
      <circle class="dot" cx="${x}" cy="${y}" r="${rr}" fill="var(--s${m.score})" stroke-width="${sw}"/>
      ${m.num?`<text x="${x}" y="${y}" font-size="${rr*1.25}">${m.num}</text>`:''}</g>`;
  }).join('');
  return `<svg class="map" viewBox="${vb.join(' ')}" role="img" aria-label="${esc(opts.label)}">
    <path class="grat" d="${GRAT}" stroke-width="${.5*k}"/><path class="land" d="${D.land}"/>${rng}${mks}</svg>`;
}
function bboxOfPath(p){
  const n = (p.match(/-?\d+\.?\d*/g) || []).map(Number); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (let i=0;i+1<n.length;i+=2){ x0=Math.min(x0,n[i]); x1=Math.max(x1,n[i]); y0=Math.min(y0,n[i+1]); y1=Math.max(y1,n[i+1]); }
  return [x0,y0,x1,y1];
}

/* ---------- navigatie ---------- */
const NAV = [['start','navHome'],['soorten','navSpecies'],['topspots','navTop'],['verantwoord','navResp'],['europa','navEur'],['paklijst','navPack'],['over','navAbout']];
function renderChrome(route){
  document.documentElement.lang = L;
  document.title = route.title ? `${route.title} · ${T(U.title)}` : T(U.title);
  $('#brandName').textContent = L === 'nl' ? 'Spottersgids' : "Spotter's Guide";
  $('#brandSub').textContent = T(U.brandSub);
  $('#nav').innerHTML = NAV.map(([id,k]) => `<a href="#${id}"${route.nav===id?' aria-current="page"':''}>${esc(T(U[k]))}</a>`).join('');
  $('#langNl').setAttribute('aria-pressed', L==='nl'); $('#langEn').setAttribute('aria-pressed', L==='en');
  $('#foot').innerHTML = `<p style="max-width:36rem">${esc(T(U.footMade))}</p><nav>${NAV.slice(3).map(([id,k])=>`<a href="#${id}">${esc(T(U[k]))}</a>`).join('')}</nav>`;
}
$('#menuBtn').onclick = () => { const o = $('#nav').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', o); };
$('#nav').addEventListener('click', e => { if (e.target.closest('a')) { $('#nav').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', false); } });
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { L = b.dataset.l; try { localStorage.setItem('sg-lang', L); } catch(e) {} route(true); });

/* ---------- startpagina ---------- */
let SEL = null;
function inFilter(cont){ return FILTER === 'all' || cont === FILTER; }
function filtersHtml(){
  return `<div class="filters"><div class="wrap" role="group" aria-label="${esc(L==='nl'?'Filter per werelddeel':'Filter by continent')}">
    ${['all',...CONTS].map(c => `<button type="button" class="chip" data-f="${c}" aria-pressed="${FILTER===c}">${esc(c==='all'?T(U.all):contName(c))}</button>`).join('')}</div></div>`;
}
function topspotList(){
  const list = [];
  SPOTS.forEach(s => { if (!inFilter(s.cont)) return;
    const recs = s.recs.filter(r => r.top).sort((a,b) => b.score - a.score || a.no - b.no);
    if (recs.length) list.push({s, r:recs[0], recs}); });
  list.sort((a,b) => b.r.score - a.r.score || CONTS.indexOf(a.s.cont) - CONTS.indexOf(b.s.cont) || a.r.no - b.r.no);
  return list;
}
function homeTopsHtml(){
  const list = topspotList();
  if (!list.length) return `<p class="empty">${esc(L==='nl'?'Geen topspots in dit werelddeel.':'No top spots on this continent.')}</p>`;
  return `<div class="tops">${list.map(({s,r,recs}) => { const c = BY[r.no];
    return `<button type="button" class="tcard" data-spot="${esc(s.id)}" data-no="${r.no}">
      <div class="ph">${img(c.photos[0], catName(c))}<span class="tag">${esc(contName(s.cont))}</span></div>
      <div class="bd"><span class="sp">${recs.map(x => esc(catName(BY[x.no]))).join(' · ')}</span><h3>${esc(T(s.name))}</h3><span class="where">${esc(T(s.country))}</span>
      ${scoreHtml(r.score)}<span class="ssn">${esc(T(r.season))}</span></div></button>`; }).join('')}</div>`;
}
function homeMarkers(){
  return SPOTS.filter(s => inFilter(s.cont)).map(s => ({id:s.id, lat:s.lat, lon:s.lon, score:spotMax(s), ring:isTop(s), sel:SEL===s.id,
    label:`${T(s.name)}, ${T(s.country)}`})).sort((a,b)=>a.score-b.score);
}
function panelHtml(){
  const s = SEL && SPOT[SEL];
  if (!s) return `<p class="hint">${esc(T(U.mapHint))}</p>`;
  const recs = s.recs.slice().sort((a,b)=>b.score-a.score);
  return `<h3>${esc(T(s.name))}</h3><p class="meta">${esc(placeLine(s))}</p>
    ${recs.map(r => { const c = BY[r.no], page = PAGES[r.no];
      return `<div class="rec"><div class="sp">${esc(catName(c))} ${scoreHtml(r.score)}</div>
      <p>${esc(T(r.why))}</p>${factsHtml(r)}
      <p>${page ? `<a class="btnlink" href="#soort-${r.no}">${esc(T(U.toPage))} →</a>` : `<span class="soon">${esc(T(U.soonPage))}</span>`}</p></div>`; }).join('')}`;
}
function legendHtml(){
  return `<div class="maplegend"><span>${esc(T(U.legend))}</span>${[5,4,3,2,1].map(n=>`<span><i style="--c:var(--s${n})"></i>${n}</span>`).join('')}<span>◯ ${esc(T(U.topRing))}</span></div>`;
}
function speciesGridHtml(){
  const cats = CATS.filter(c => FILTER === 'all' || c.cont.includes(FILTER));
  return `<div class="grid">${cats.map(c => { const page = PAGES[c.no], best = BEST[c.no];
    const inner = `<div class="ph">${img(c.photos[0], catName(c))}</div><div class="bd"><span class="no">№ ${c.no}</span><span class="nm">${esc(catName(c))}</span><span class="la lat">${esc(c.la)}</span>
      <span class="ft">${best ? scoreHtml(best, false, true) : ''}${page ? '' : `<span class="soon">${esc(T(U.soon))}</span>`}</span></div>`;
    return page ? `<a class="scard" href="#soort-${c.no}">${inner}</a>` : `<div class="scard off">${inner}</div>`; }).join('')}</div>`;
}
function scaleHtml(){
  return `<details class="box" style="margin-top:16px"><summary style="cursor:pointer;font-weight:700">${esc(T(U.scaleTitle))}</summary>
  <ul class="check" style="margin-top:12px;list-style:none">${[5,4,3,2,1].map(n=>`<li style="display:flex;gap:10px;align-items:center;grid-template-columns:none">${scoreHtml(n)}<span>${esc(T(U.scale[n]))}</span></li>`).join('')}</ul></details>`;
}
function renderHome(focus){
  $('#main').innerHTML = `
  <section class="intro"><div class="wrap"><h1>${esc(T(U.title))}</h1><p class="sub">${esc(T(U.sub))}</p></div></section>
  ${filtersHtml()}
  <section class="sec" id="topspots"><div class="wrap"><div class="sechead"><h2>${esc(T(U.topTitle))}</h2><p>${esc(T(U.topSub))}</p></div><div id="tops">${homeTopsHtml()}</div>${scaleHtml()}</div></section>
  <section class="sec" id="kaart"><div class="wrap"><div class="sechead"><h2>${esc(T(U.mapTitle))}</h2><p>${esc(T(U.mapSub))}</p></div>
    <div class="mapbox"><div id="mapwrap"></div>${legendHtml()}<div class="panel" id="panel" aria-live="polite"></div></div></div></section>
  <section class="sec" id="soorten"><div class="wrap"><div class="sechead"><h2>${esc(T(U.spTitle))}</h2><p>${esc(T(U.spSub))}</p></div><div id="grid">${speciesGridHtml()}</div></div></section>`;
  drawHomeMap(); $('#panel').innerHTML = panelHtml();
  document.querySelectorAll('.chip[data-f]').forEach(b => b.onclick = () => {
    FILTER = b.dataset.f; try { localStorage.setItem('sg-cont', FILTER); } catch(e) {}
    if (SEL && SPOT[SEL] && !inFilter(SPOT[SEL].cont)) SEL = null;
    document.querySelectorAll('.chip[data-f]').forEach(x => x.setAttribute('aria-pressed', x.dataset.f === FILTER));
    $('#tops').innerHTML = homeTopsHtml(); $('#grid').innerHTML = speciesGridHtml(); drawHomeMap(); $('#panel').innerHTML = panelHtml(); bindTops();
  });
  bindTops();
  if (focus) { const el = document.getElementById(focus); if (el) requestAnimationFrame(() => el.scrollIntoView({block:'start'})); }
  else window.scrollTo(0,0);
}
function bindTops(){
  document.querySelectorAll('.tcard').forEach(b => b.onclick = () => {
    const no = +b.dataset.no;
    if (PAGES[no]) { location.hash = 'soort-' + no; return; }
    SEL = b.dataset.spot; drawHomeMap(); $('#panel').innerHTML = panelHtml();
    $('#kaart').scrollIntoView({block:'start'});
  });
}
function drawHomeMap(){
  const mw = $('#mapwrap'), keep = mw.scrollLeft;
  mw.className = 'mapscroll' + (FILTER === 'all' ? ' world' : '');
  mw.innerHTML = mapSvg({box:BOX[FILTER], markers:homeMarkers(), label:T(U.mapTitle)});
  if (FILTER === 'all' && mw.scrollWidth > mw.clientWidth) mw.scrollLeft = keep || (mw.scrollWidth - mw.clientWidth) * .55;
  bindMarkers($('#mapwrap'), id => { SEL = id; drawHomeMap(); $('#panel').innerHTML = panelHtml(); });
}
function bindMarkers(root, fn){
  root.querySelectorAll('.mk').forEach(g => { g.onclick = () => fn(g.dataset.id); g.onkeydown = e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); fn(g.dataset.id); } }; });
}

/* ---------- soortpagina ---------- */
function renderSpecies(no){
  const c = BY[no], P = PAGES[no];
  if (!c || !P) return renderMissing(c);
  const recs = P.spots.map(id => { const s = SPOT[id]; return {s, r:s.recs.find(r => r.no === no)}; });
  const local = {}; P.sources.forEach((g,i) => local[g] = i+1);
  const cite = ids => (ids||[]).filter(g => local[g]).map(g => `<a class="cite" href="#bron-${no}-${local[g]}" data-src="${local[g]}">[${local[g]}]</a>`).join('');
  const best = Math.max(...recs.map(x => x.r.score));
  // kaartuitsnede: leefgebied + plekken
  let [x0,y0,x1,y1] = c.range ? bboxOfPath(c.range) : [720,284,0,0];
  recs.forEach(({s}) => { const [x,y] = proj(s.lat, s.lon); x0=Math.min(x0,x); x1=Math.max(x1,x); y0=Math.min(y0,y); y1=Math.max(y1,y); });
  const pad = 14, box = [x0-pad, y0-pad, Math.max(60, x1-x0+2*pad), Math.max(30, y1-y0+2*pad)];
  const markers = recs.map(({s,r},i) => ({id:s.id, lat:s.lat, lon:s.lon, score:r.score, num:i+1, label:`${i+1}. ${T(s.name)}`})).reverse();
  const intro = T(P.intro);
  $('#main').innerHTML = `
  <div class="wrap"><p class="crumbs"><a href="#soorten">← ${esc(T(U.back))}</a></p>
  <section class="sphead">
    <figure class="hero"><div class="ph">${img(c.photos[0], catName(c), true)}</div><figcaption>${credit(c.photos[0].cr)}</figcaption></figure>
    <div class="idblock">
      <span class="lbl">№ ${c.no} · ${c.cont.map(contName).join(' · ')}</span>
      <h1>${esc(catName(c))}</h1>
      <p class="en">${esc(L==='nl'?c.en:c.nl)} · <span class="lat">${esc(c.la)}</span></p>
      <div class="badges">${iucnHtml(c.iucn)} ${scoreHtml(best, true)}</div>
      <p class="lead">${esc(intro.replace(/\s*(Kans|Chance):\s*\d.*$/s,''))}${(intro.match(/(Kans|Chance):\s*\d.*$/s)||[''])[0] ? `<span class="kans">${esc((intro.match(/(Kans|Chance):\s*\d.*$/s))[0])}</span>` : ''}</p>
    </div>
  </section>
  <section class="sec" style="padding-top:0"><div class="sechead"><h2>${esc(T(U.bestSpots))}</h2><p>${esc(T(U.bestSpotsSub))}</p></div>
    <ol class="spots">${recs.map(({s,r},i) => `<li class="spot" id="plek-${esc(s.id)}" style="--c:var(--s${r.score})">
      <div class="hd"><span class="rank">${i+1}</span><div><h3>${esc(T(s.name))}</h3><p class="where">${esc(placeLine(s))}</p></div></div>
      ${scoreHtml(r.score)}
      <p class="why">${esc(T(r.why))}${cite(r.src)}</p>${factsHtml(r)}</li>`).join('')}</ol></section>
  <section class="sec"><div class="sechead"><h2>${esc(T(U.habitat))}</h2></div>
    <div class="mapbox"><div id="spmap">${mapSvg({box, range:c.range, markers, label:T(U.habitat)+': '+catName(c)})}</div>${legendHtml().replace(/<span>◯[^<]*<\/span>/,'')}<div class="panel"><p class="note">${esc(T(U.habitatNote))}</p></div></div></section>
  <section class="sec two">
    <div><h2>${esc(T(U.tips))}</h2><ul class="tips" style="margin-top:14px">${T(P.tips).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div><h2>${esc(T(U.status))}</h2><div class="box" style="margin-top:14px;display:grid;gap:12px">
      <div>${iucnHtml(c.iucn)}</div><p>${esc(T(P.status))}${cite(P.statusSrc)}</p>
      <h3>${esc(T(U.threats))}</h3><ul class="tips">${T(P.threats).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
  </section>
  ${c.photos.length > 1 ? `<section class="sec"><h2 style="margin-bottom:14px">${esc(T(U.photos))}</h2><div class="gallery">${c.photos.slice(1).map(p => `<figure><div class="ph">${img(p, catName(c))}</div><figcaption>${credit(p.cr)}</figcaption></figure>`).join('')}</div></section>` : ''}
  <section class="sec read"><h2 style="margin-bottom:14px">${esc(T(U.sources))}</h2>
    <ol class="sources">${P.sources.map((g,i) => `<li id="bron-${no}-${i+1}"><a href="${esc(SRC[g].url)}" target="_blank" rel="noopener">${esc(T(SRC[g].title))}</a></li>`).join('')}</ol>
    <p class="note" style="margin-top:14px">${esc(L==='nl'?'Foto’s, leefgebied en IUCN-status: De KATalogue.':'Photos, range and IUCN status: De KATalogue.')}</p></section>
  </div>`;
  bindMarkers($('#spmap'), id => { const el = document.getElementById('plek-' + id); if (el) el.scrollIntoView({block:'center'}); });
  document.querySelectorAll('.cite').forEach(a => a.onclick = e => { e.preventDefault(); const el = document.getElementById(a.getAttribute('href').slice(1)); if (el) { el.scrollIntoView({block:'center'}); el.style.background='color-mix(in srgb,var(--accent) 18%,transparent)'; setTimeout(()=>el.style.background='',1600); } });
  window.scrollTo(0,0);
  return catName(c);
}
function renderMissing(c){
  $('#main').innerHTML = `<div class="wrap sec read"><h1>${esc(c ? catName(c) : '404')}</h1><p style="margin-top:12px">${esc(c ? T(U.soonPage) + '.' : T(U.notFound))}</p><p style="margin-top:16px"><a class="btnlink" href="#soorten">← ${esc(T(U.back))}</a></p></div>`;
  window.scrollTo(0,0);
  return c ? catName(c) : '';
}

/* ---------- tekstpagina's ---------- */
function renderText(id){
  const pg = D.text[id];
  let html = `<div class="wrap sec"><div class="read prose"><span class="lbl">${esc(T(pg.eyebrow))}</span><h1>${esc(T(pg.title))}</h1>${T(pg.html)}`;
  if (id === 'europa') html += europaList();
  if (id === 'over') html += `<p><a class="kofi" href="${esc(KOFI_URL)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 6h13a4 4 0 0 1 0 8h-1.1A6 6 0 0 1 10 19H9a5 5 0 0 1-5-5V6zm12 2v4h1a2 2 0 0 0 0-4h-1z"/></svg>${esc(L==='nl'?'Trakteer me op een koffie (Ko-fi)':'Buy me a coffee (Ko-fi)')}</a></p>`;
  if (pg.sources && pg.sources.length) html += `<h2>${esc(T(U.sources))}</h2><ol class="sources">${pg.sources.map(g => `<li><a href="${esc(SRC[g].url)}" target="_blank" rel="noopener">${esc(T(SRC[g].title))}</a></li>`).join('')}</ol>`;
  html += `</div></div>`;
  $('#main').innerHTML = html; window.scrollTo(0,0);
  return T(pg.title);
}
function europaList(){
  return `<div class="eurlist">${D.europe.map(e => { const c = BY[e.no], page = PAGES[e.no];
    const inner = `${img(c.photos[0], catName(c))}<div><span class="lbl">${esc(T(e.where))}</span><b style="font-family:var(--display);font-size:1.15rem">${esc(catName(c))}</b><span class="lat">${esc(c.la)}</span>${BEST[e.no]?scoreHtml(BEST[e.no]):''}<span>${esc(T(e.text))}</span></div>`;
    return page ? `<a class="eurrow" href="#soort-${e.no}">${inner}</a>` : `<div class="eurrow">${inner}</div>`; }).join('')}</div>`;
}

/* ---------- router ---------- */
function route(keepScroll){
  const h = (location.hash || '#start').slice(1);
  let title = '', nav = 'start';
  const y = window.scrollY;
  if (h === 'start' || h === '' ) { renderHome(); }
  else if (h === 'topspots' || h === 'soorten' || h === 'kaart') { nav = h === 'kaart' ? 'start' : h; renderHome(keepScroll ? null : h); }
  else if (/^soort-\d+$/.test(h)) { nav = 'soorten'; title = renderSpecies(+h.slice(6)); }
  else if (D.text[h]) { nav = h; title = renderText(h); }
  else { title = renderMissing(null); }
  renderChrome({title, nav});
  if (keepScroll) window.scrollTo(0, y);
}
window.addEventListener('hashchange', () => route(false));
route(false);
})();
</script>
