<meta charset="utf-8">
<title>Spottersgids voor wilde katten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Waar je alle 42 wilde kattensoorten in het wild kunt zien, hoe groot je kans is en hoe je ze spot. Een gids van J. Gelens.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: veldgids – smalle leeskolom, brede kaart- en fotobanden; één lichte stijl (droog gras), ook als het toestel in donkere modus staat. */
:root{
  --bg:#E3E1D0;          /* droog gras */
  --paper:#F0EEE2;       /* veldboek */
  --ink:#1E2318;         /* bosgroen-zwart */
  --muted:#5A604D;
  --line:#C6C3AD;
  --olive:#46552E;
  --accent:#9B5A1C;      /* oker / sienna */
  --accent-ink:#FFF8EA;
  --sea:#CFD3C2;
  --land:#B9B49A;
  --range:#9B5A1C;
  --s5:#2F6A33; --s4:#6A8526; --s3:#B0861A; --s2:#B05F28; --s1:#8B8676;
  --shadow:0 1px 0 rgba(30,35,24,.06),0 8px 24px -12px rgba(30,35,24,.25);
  --display:"Alegreya",Georgia,"Times New Roman",serif;
  --body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --label:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gutr:max(16px,env(safe-area-inset-right,0px));
  --head:57px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
a{color:inherit;text-decoration-color:color-mix(in srgb,var(--accent) 60%,transparent);text-underline-offset:3px}
a:hover{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(1.5rem,4vw,2rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}
.read{max-width:44rem}
.lbl{font-family:var(--label);font-weight:600;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lat{font-family:var(--display);font-style:italic;font-weight:500}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand svg{flex:none;width:30px;height:30px;color:var(--accent)}
.brand b{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--label);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.nav{display:flex;gap:2px;margin-left:auto;align-items:center}
.nav a,.morebtn{text-decoration:none;font-weight:500;font-size:.98rem;padding:8px 11px;border-radius:6px;white-space:nowrap;border:0;background:none;cursor:pointer}
.nav a[aria-current="page"],.morebtn.cur{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.more{position:relative}
.morebtn svg{width:10px;height:10px;margin-left:5px;vertical-align:1px}
.moremenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:220px;display:none;flex-direction:column}
.more.open .moremenu{display:flex}
.moremenu .mlbl{display:none}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;padding:2px;flex:none}
.lang button{border:0;background:none;padding:4px 10px;border-radius:99px;font-family:var(--label);font-weight:600;letter-spacing:.06em;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.menubtn{display:none;border:1px solid var(--line);background:none;border-radius:8px;padding:6px 9px;cursor:pointer;flex:none}
.menubtn svg{display:block;width:20px;height:20px}
@media (max-width:820px){
  .menubtn{display:block}
  .nav{position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;background:var(--paper);border-bottom:1px solid var(--line);padding:6px var(--gutr) 14px var(--gut);margin:0;display:none;box-shadow:var(--shadow)}
  .nav.open{display:flex}
  .nav a{padding:12px 6px;font-size:1.08rem;border-bottom:1px solid var(--line);border-radius:0}
  .morebtn{display:none}
  .moremenu{display:flex;position:static;border:0;box-shadow:none;background:none;padding:0;min-width:0}
  .moremenu .mlbl{display:block;padding:14px 6px 2px}
  .moremenu a{font-size:1rem;color:var(--muted)}
  .lang{margin-left:auto}
}

/* sections */
main{display:block;min-height:70vh}
.sec{padding-block:30px}
.sec + .sec{padding-top:8px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:16px}
.sechead p{color:var(--muted);max-width:40rem}
.intro{padding-block:26px 6px}
.intro p.sub{font-size:1.15rem;color:var(--muted);margin-top:8px;max-width:40rem}

/* filter + tabbladen */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--head));z-index:10;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 13px;font-weight:500;cursor:pointer;white-space:nowrap;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--paper)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper);max-width:520px}
.tab{border:0;background:none;padding:9px 6px;font-weight:700;cursor:pointer;font-size:1rem;border-left:1px solid var(--line)}
.tab:first-child{border-left:0}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab small{font-family:var(--label);font-weight:600;font-size:.8rem;opacity:.75;margin-left:4px}

/* score */
.score{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.pips{display:inline-flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--c);background:transparent}
.pips i.on{background:var(--c)}
.score b{font-family:var(--label);font-weight:600;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.big .pips i{width:13px;height:13px}
.big b{font-size:1rem}

/* topspots */
.tops{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;cursor:pointer;text-align:left;padding:0;box-shadow:var(--shadow);transition:transform .15s}
.tcard:hover{transform:translateY(-2px);color:inherit}
.tcard .ph{position:relative;aspect-ratio:16/10;background:var(--land);overflow:hidden}
.tcard img{width:100%;height:100%;object-fit:cover;display:block}
.tcard .tag{position:absolute;left:8px;top:8px;background:var(--paper);color:var(--ink);border-radius:4px;padding:2px 7px;font-family:var(--label);font-weight:600;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
.tcard .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.tcard h3{font-size:1.15rem}
.tcard .where{color:var(--muted);font-size:.95rem}
.tcard .sp{font-weight:700}
.tcard .ssn{font-size:.9rem;color:var(--muted);margin-top:auto}
.tcard .bd .score b{white-space:normal}
@media (max-width:600px){
  .tops{grid-template-columns:1fr;gap:10px}
  .tcard{flex-direction:row}
  .tcard .ph{flex:none;width:108px;aspect-ratio:auto}
  .tcard .tag{display:none}
  .tcard .bd{padding:10px 12px;gap:3px}
  .tcard h3{font-size:1.05rem}
  .tcard .ssn{display:none}
}
.morewrap{display:flex;justify-content:center;margin-top:16px}
.btn{border:1px solid var(--ink);background:none;border-radius:99px;padding:9px 18px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--paper)}
.empty{color:var(--muted);font-style:italic;padding:12px 0}
.catrow{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;margin:0 0 4px;scrollbar-width:thin}
.catbtn{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:4px 2px;cursor:pointer;border-radius:10px;font-size:.8rem;line-height:1.15;text-align:center}
.catbtn .av{width:54px;height:54px;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:var(--land);display:flex;align-items:center;justify-content:center;font-family:var(--label);font-weight:600;color:var(--paper)}
.catbtn img{width:100%;height:100%;object-fit:cover;display:block}
.catbtn.grey .av{filter:grayscale(1);opacity:.55}
.catbtn.grey{color:var(--muted)}
.catbtn[aria-pressed="true"]{background:color-mix(in srgb,var(--olive) 14%,transparent);font-weight:700}
.catbtn[aria-pressed="true"] .av{border-color:var(--olive);box-shadow:0 0 0 2px var(--olive)}
.catnote{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 12px}
.catnote b{font-family:var(--display);font-size:1.15rem}
.map .mk.dim{opacity:.35}
.also{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.also label{font-weight:700}
.also select{font:inherit;font-size:16px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%}
.alsolist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.alsolist li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}

/* kaart */
.mapbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mapscroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
@media (max-width:600px){.mapscroll.world .map{width:680px;max-width:none}}
.map{display:block;width:100%;height:auto;background:var(--sea);touch-action:manipulation}
.map .land{fill:var(--land)}
.map .grat{stroke:color-mix(in srgb,var(--ink) 7%,transparent);fill:none}
.map .rng{fill:var(--range);fill-opacity:.32;stroke:var(--range);stroke-opacity:.7;stroke-linejoin:round}
.map .mk{cursor:pointer}
.map .mk .dot{stroke:var(--paper);stroke-linejoin:round}
.map .mk.sel .dot{stroke:var(--ink)}
.map .mk text{font-family:var(--label);font-weight:600;fill:var(--paper);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted);align-items:center}
.maplegend span{display:inline-flex;align-items:center;gap:5px}
.maplegend i{width:11px;height:11px;border-radius:50%;background:var(--c);display:inline-block}
.maplegend svg{width:14px;height:14px}
.panel{border-top:1px solid var(--line);padding:16px 14px 18px;scroll-margin-top:170px}
.panel .hint{color:var(--muted)}
.panel h3{font-size:1.35rem}
.panel .meta{color:var(--muted);margin:2px 0 10px}
.rec{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px;display:grid;gap:4px}
.rec:first-of-type{border-top:0;margin-top:0;padding-top:0}
.rec .sp{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-weight:700;font-size:1.05rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 18px;margin:6px 0 0}
.facts div{min-width:0}
.facts dd{margin:0}
.facts dt{font-family:var(--label);font-weight:600;font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.soon{display:inline-block;font-family:var(--label);font-weight:600;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:var(--muted);width:max-content}
.btnlink{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--accent);text-decoration:none}
.btnlink:hover{text-decoration:underline}

/* soorten */
.search{width:100%;max-width:420px;padding:10px 14px;border-radius:99px;border:1px solid var(--line);background:var(--paper);font:inherit;font-size:16px;color:var(--ink);margin-bottom:18px}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.grouph{display:flex;align-items:baseline;gap:10px;margin:6px 0 12px}
.grouph h3{font-size:1.25rem}
.grouph span{font-family:var(--label);font-weight:600;color:var(--muted);letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.scard{display:flex;flex-direction:column;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.scard .ph{aspect-ratio:4/3;background:var(--land);overflow:hidden}
.scard img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.scard:hover img{transform:scale(1.04)}
.scard .bd{padding:9px 11px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.scard .nm{font-family:var(--display);font-weight:700;font-size:1.08rem;line-height:1.15}
.scard .la{font-size:.85rem;color:var(--muted)}
.scard .ft{margin-top:auto;padding-top:6px}
.no{font-family:var(--label);font-weight:600;color:var(--muted);font-size:.78rem;letter-spacing:.06em}
.soonlist{list-style:none;margin:0 0 10px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 22px}
.soonlist li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.soonlist img{width:52px;height:39px;object-fit:cover;border-radius:5px;display:block;filter:saturate(.75)}
.soonlist li > div{min-width:0;line-height:1.25}
.soonlist b{display:block;font-family:var(--display);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soonlist .la{font-size:.82rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* soortpagina */
.crumbs{padding-top:16px;font-size:.92rem;color:var(--muted)}
.crumbs a{color:var(--muted)}
.sphead{display:grid;gap:20px;padding-block:12px 18px;align-items:start}
@media (min-width:860px){.sphead{grid-template-columns:1.1fr 1fr}}
.hero{margin:0}
.hero .ph{aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;background:var(--land)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
figcaption{font-size:.82rem;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.idblock{display:flex;flex-direction:column;gap:10px;min-width:0}
.idblock .en{font-size:1.1rem;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.iucn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 4px;font-size:.92rem;width:max-content;max-width:100%}
.iucn b{font-family:var(--label);font-weight:600;letter-spacing:.05em;border-radius:99px;padding:1px 7px;color:#fff;background:var(--ic)}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:0}
.summary > div{padding:12px 14px;border-left:1px solid var(--line);min-width:0;display:grid;gap:4px;align-content:start}
.summary > div:first-child{border-left:0}
.summary dt{font-family:var(--label);font-weight:600;font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.summary dd{margin:0;font-weight:700;line-height:1.3}
.summary dd small{display:block;font-weight:400;color:var(--muted)}
@media (max-width:520px){.summary{grid-template-columns:1fr 1fr}.summary > div:nth-child(3){grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
.lead{font-family:var(--display);font-size:1.22rem;line-height:1.5;font-weight:500}
.lead .kans{display:block;margin-top:10px;font-family:var(--label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:1rem;color:var(--accent)}
.jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--head));z-index:9;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-block:1px solid var(--line)}
.jump .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.jump .wrap::-webkit-scrollbar{display:none}
.jump button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 13px;font-weight:500;cursor:pointer;white-space:nowrap}
.jump button:hover{border-color:var(--ink)}
.anchor{scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--head) + 60px)}
.spots{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.spot{background:var(--paper);border:1px solid var(--line);border-radius:12px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--head) + 60px)}
.spot summary{list-style:none;display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.spot summary::-webkit-details-marker{display:none}
.spot .rank{flex:none;width:32px;height:32px;border-radius:50%;background:var(--c);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--label);font-weight:600;font-size:1.02rem}
.spot .tt{min-width:0;flex:1;display:grid;gap:2px}
.spot h3{font-size:1.18rem}
.spot .where{color:var(--muted);font-size:.93rem}
.spot .chev{flex:none;width:14px;height:14px;color:var(--muted);transition:transform .2s}
.spot[open] .chev{transform:rotate(180deg)}
.spot .sc-sum{flex:none}
.spot[open] .sc-sum{display:none}
.spot .body{padding:0 14px 14px 58px;display:grid;gap:8px}
@media (max-width:520px){.spot .body{padding-left:14px}.spot .sc-sum b{display:none}}
.spot .why{font-size:1rem}
.cite{font-size:.75rem;vertical-align:super;line-height:0;margin-left:2px;color:var(--muted);text-decoration:none}
.cite:hover{color:var(--accent)}
.tips{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.tips li{padding-left:26px;position:relative}
.tips li::before{content:"";position:absolute;left:2px;top:.45em;width:12px;height:12px;border-radius:50% 50% 45% 45%;background:var(--olive);opacity:.85;
  box-shadow:-5px -8px 0 -3px var(--olive),0 -10px 0 -3px var(--olive),5px -8px 0 -3px var(--olive)}
.two{display:grid;gap:28px}
@media (min-width:860px){.two{grid-template-columns:1fr 1fr}}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gallery figure{margin:0}
.gallery .ph{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--land)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.sources{margin:0;padding-left:1.6em;display:grid;gap:6px;font-size:.95rem;overflow-wrap:anywhere}
.note{font-size:.92rem;color:var(--muted)}
.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px}
.prose{display:grid;gap:14px}
.prose h2{margin-top:18px}
.prose h3{margin-top:8px}
.prose ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.kofi{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;padding:12px 20px;border-radius:99px;width:max-content;max-width:100%}
.kofi:hover{color:var(--accent-ink);filter:brightness(1.07)}

<script>
'use strict';
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const KOFI_URL = 'https://ko-fi.com/katalogue';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let L = 'nl';
try { const s = localStorage.getItem('sg-lang'); if (s === 'en' || s === 'nl') L = s; else if (!/^nl/i.test(navigator.language || 'nl')) L = 'en'; } catch(e) {}
const T = o => o == null ? '' : (typeof o === 'string' ? o : (o[L] != null ? o[L] : o.nl));

/* ---------- vaste teksten ---------- */
const U = {
  title:{nl:'Spottersgids voor wilde katten',en:"Wild Cat Spotter's Guide"},
  brandSub:{nl:'wilde katten · J. Gelens',en:'wild cats · J. Gelens'},
  navSpecies:{nl:'Soorten',en:'Species'}, navTop:{nl:'Topspots',en:'Top spots'}, navMap:{nl:'Kaart',en:'Map'},
  navResp:{nl:'Verantwoord spotten',en:'Responsible spotting'}, navEur:{nl:'Katten in Europa',en:'Cats in Europe'},
  navPack:{nl:'Paklijst',en:'Packing list'}, navAbout:{nl:'Over mij',en:'About me'}, navMore:{nl:'Meer',en:'More'},
  sub:{nl:'Waar je alle 42 wilde kattensoorten in het wild kunt zien, hoe groot je kans is en hoe je ze vindt.',en:'Where to see all 42 wild cat species in the wild, how good your chances are and how to find them.'},
  all:{nl:'Hele wereld',en:'Whole world'},
  topSub:{nl:'Plekken waar je een soort (bijna) zeker ziet, mits je de tijd neemt en in het goede seizoen gaat.',en:'Places where you will (almost) certainly see a species, as long as you take your time and go in the right season.'},
  showAll:{nl:'Toon alle topspots',en:'Show all top spots'}, showLess:{nl:'Toon minder',en:'Show fewer'},
  mapSub:{nl:'Markers staan op het midden van een reservaat of gebied, nooit op een hol of vaste rustplek.',en:'Markers sit at the centre of a reserve or area, never on a den or regular resting place.'},
  allCats:{nl:'Alle katten',en:'All cats'},
  noSpot:{nl:'Nog geen spotplek; volgt binnenkort',en:'No spotting site yet; coming soon'},
  catMap:{nl:'Waar zit welke kat? Kies een soort:',en:'Which cat lives where? Pick a species:'},
  catShown:{nl:'plekken op de kaart',en:'places on the map'},
  catShown1:{nl:'plek op de kaart',en:'place on the map'},
  alsoLbl:{nl:'Ook te zien op deze plekken:',en:'Also seen at these places:'},
  alsoNone:{nl:'— kies een kat —',en:'— pick a cat —'},
  alsoAt:{nl:'zie je ook bij:',en:'can also be seen at:'},
  mapHint:{nl:'Tik op een marker om te zien welke katten je daar kunt vinden.',en:'Tap a marker to see which cats you can find there.'},
  search:{nl:'Zoek een soort (NL, Engels of Latijn)',en:'Search a species (Dutch, English or Latin)'},
  ready:{nl:'Klaar om te spotten',en:'Ready to spot'},
  soon:{nl:'Volgt binnenkort',en:'Coming soon'},
  noHits:{nl:'Geen soort gevonden.',en:'No species found.'},
  soonPage:{nl:'Soortpagina volgt binnenkort',en:'Species page coming soon'},
  toPage:{nl:'Naar de soortpagina',en:'Go to the species page'},
  season:{nl:'Seizoen',en:'Season'}, time:{nl:'Tijdstip',en:'Time of day'}, trip:{nl:'Soort tocht',en:'Type of trip'},
  bestPlace:{nl:'Beste plek',en:'Best place'}, bestTime:{nl:'Beste tijd',en:'Best time'},
  jPlaces:{nl:'Plekken',en:'Places'}, jMap:{nl:'Kaart',en:'Map'}, jTips:{nl:'Tips',en:'Tips'}, jStatus:{nl:'Status',en:'Status'}, jSources:{nl:'Bronnen',en:'Sources'},
  bestSpots:{nl:'De beste plekken',en:'The best places'},
  bestSpotsSub:{nl:'Op volgorde van kans. Tik op een plek voor alle details.',en:'In order of chance. Tap a place for all details.'},
  tips:{nl:'Spottips',en:'Spotting tips'},
  habitat:{nl:'Leefgebied en spotplekken',en:'Range and spotting sites'},
  habitatNote:{nl:'Gekleurd: leefgebied bij benadering (bron: De KATalogue, op basis van openbare verspreidingskaarten). Cijfers: de plekken hierboven.',en:'Shaded: approximate range (source: De KATalogue, based on public range maps). Numbers: the places listed above.'},
  status:{nl:'Status en bedreigingen',en:'Status and threats'},
  threats:{nl:'Belangrijkste bedreigingen',en:'Main threats'},
  photos:{nl:"Foto's",en:'Photos'},
  sources:{nl:'Bronnen',en:'Sources'},
  back:{nl:'Alle soorten',en:'All species'},
  chance:{nl:'Kans',en:'Chance'},
  legend:{nl:'Kans:',en:'Chance:'},
  topStar:{nl:'topspot',en:'top spot'},
  cont:{eur:{nl:'Europa',en:'Europe'},afr:{nl:'Afrika',en:'Africa'},asia:{nl:'Azië',en:'Asia'},nam:{nl:'Noord-Amerika',en:'North America'},sam:{nl:'Midden- en Zuid-Amerika',en:'Central & South America'}},
  sc:{5:{nl:'bijna zeker',en:'almost certain'},4:{nl:'grote kans',en:'good chance'},3:{nl:'redelijke kans',en:'fair chance'},2:{nl:'kleine kans',en:'small chance'},1:{nl:'veel geluk nodig',en:'needs a lot of luck'}},
  scaleTitle:{nl:'Zo lees je de kansscore',en:'How to read the chance score'},
  scale:{5:{nl:'de meeste bezoekers met een goed geplande reis zien de soort',en:'most visitors on a well-planned trip see the species'},4:{nl:'grote kans',en:'good chance'},3:{nl:'redelijke kans',en:'fair chance'},2:{nl:'kleine kans',en:'small chance'},1:{nl:'alleen met veel geluk of via cameravallen',en:'only with a lot of luck or via camera traps'}},
  iucn:{LC:{nl:'Niet bedreigd',en:'Least Concern'},NT:{nl:'Gevoelig',en:'Near Threatened'},VU:{nl:'Kwetsbaar',en:'Vulnerable'},EN:{nl:'Bedreigd',en:'Endangered'},CR:{nl:'Ernstig bedreigd',en:'Critically Endangered'},NE:{nl:'Niet beoordeeld',en:'Not Evaluated'},DD:{nl:'Onvoldoende gegevens',en:'Data Deficient'}},
  footMade:{nl:'Een gids van J. Gelens. Soortgegevens, foto’s en verspreidingskaarten: De KATalogue. Plekken en kansen: zie de bronnen per soort.',en:'A guide by J. Gelens. Species data, photos and range maps: De KATalogue. Places and chances: see the sources on each species page.'},
  photoPre:{nl:'foto:',en:'photo:'},
  notFound:{nl:'Deze pagina bestaat niet (meer).',en:'This page does not exist.'}
};
const IUCN_COL = {LC:'#4C7A3A',NT:'#7E8C2A',VU:'#B8860B',EN:'#C25B1E',CR:'#A3242B',NE:'#7A7868',DD:'#7A7868'};
const CONTS = ['eur','afr','asia','nam','sam'];

/* ---------- data ---------- */
const CATS = D.cats, BY = {}; CATS.forEach(c => BY[c.no] = c);
const SPOTS = D.spots, SPOT = {}; SPOTS.forEach(s => SPOT[s.id] = s);
const PAGES = D.pages;           // soortpagina's die af zijn
const SRC = D.sources;           // globale bronnenlijst
const BEST = {};                 // hoogste score per soort (alleen uit onderzochte plekken)
SPOTS.forEach(s => s.recs.forEach(r => { if (!BEST[r.no] || r.score > BEST[r.no]) BEST[r.no] = r.score; }));
const spotMax = s => Math.max(...s.recs.map(r => r.score));
const isTop = s => s.recs.some(r => r.top);
let FILTER = 'all', TAB = 'topspots', SEL = null, SHOWALL = false, Q = '', CAT = null, ALSO = null;
TAB = 'kaart';   // de kaart is de pagina die opent
try { const f = localStorage.getItem('sg-cont'); if (f && (f === 'all' || CONTS.includes(f))) FILTER = f; } catch(e) {}
const narrow = () => window.innerWidth < 600;

/* ---------- kleine bouwstenen ---------- */
const scoreHtml = (n, big, compact) => `<span class="score${big?' big':''}" style="--c:var(--s${n})" title="${esc(T(U.chance))} ${n}/5 · ${esc(T(U.sc[n]))}"><span class="pips" aria-hidden="true">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span><b>${compact ? `${n}/5` : `${esc(T(U.chance))} ${n} · ${esc(T(U.sc[n]))}`}</b></span>`;
const credit = cr => esc(String(cr || '').replace(/^foto:\s*/i, T(U.photoPre) + ' '));
const catName = c => T({nl:c.nl, en:c.en});
const img = (p, alt, eager) => `<img src="${esc(p.src)}" alt="${esc(alt)}" loading="${eager?'eager':'lazy'}" decoding="async">`;
const iucnHtml = code => `<span class="iucn" style="--ic:${IUCN_COL[code]||'#777'}"><b>${esc(code)}</b>${esc(T(U.iucn[code]||{nl:code,en:code}))}</span>`;
const contName = c => T(U.cont[c]);
const factsHtml = r => `<dl class="facts">
  ${T(r.season)?`<div><dt>${esc(T(U.season))}</dt><dd>${esc(T(r.season))}</dd></div>`:''}
  ${T(r.time)?`<div><dt>${esc(T(U.time))}</dt><dd>${esc(T(r.time))}</dd></div>`:''}
  ${T(r.trip)?`<div><dt>${esc(T(U.trip))}</dt><dd>${esc(T(r.trip))}</dd></div>`:''}</dl>`;
const placeLine = s => [T(s.area), T(s.country)].filter(Boolean).join(' · ');
const STAR = '<svg viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0,-9 2.6,-3.2 8.6,-2.8 4,1.2 5.3,7.3 0,4.1 -5.3,7.3 -4,1.2 -8.6,-2.8 -2.6,-3.2Z" fill="currentColor"/></svg>';
const CHEV = '<svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3.5 5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

/* ---------- kaart ---------- */
const W = 720, H = 284;
const proj = (lat, lon) => [(lon + 180) * 2, (84 - lat) * 2];
const BOX = { all:[0,0,720,284], eur:[330,22,140,82], afr:[318,70,162,174], asia:[404,34,290,164], nam:[8,12,262,130], sam:[108,110,206,176] };
// maakt een uitsnede met verhouding r (breedte/hoogte) rond een kader
function fit(b, r){
  let [x,y,w,h] = b;
  if (w/h > r){ const nh = w/r; y -= (nh-h)/2; h = nh; } else { const nw = h*r; x -= (nw-w)/2; w = nw; }
  if (w > W){ w = W; h = w/r; } if (h > H){ h = H; w = Math.min(W, h*r); }
  x = Math.max(0, Math.min(W-w, x)); y = Math.max(0, Math.min(H-h, y));
  return [x,y,w,h];
}
// op een telefoon mag een werelddeel hoger worden, zodat het het scherm vult
const ratioFor = b => Math.max(narrow() ? 1.05 : 1.9, Math.min(W/H, b[2]/b[3]));
const GRAT = (() => { let g=''; for(let lon=-150; lon<180; lon+=30) g+=`M${(lon+180)*2},0V284`; for(let lat=60; lat>-60; lat-=30) g+=`M0,${(84-lat)*2}H720`; return g; })();
const starPath = (x, y, R) => { let d=''; for (let i=0;i<10;i++){ const a = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? R*.48 : R; d += (i?'L':'M') + (x+rr*Math.cos(a)).toFixed(2) + ',' + (y+rr*Math.sin(a)).toFixed(2); } return d + 'Z'; };
function mapSvg(opts){
  const vb = opts.world ? [0,0,W,H] : fit(opts.box, ratioFor(opts.box));
  const u = vb[2] / opts.cw;                       // kaarteenheden per schermpixel
  const sw = 1.6*u, k = vb[2]/W;
  const rng = opts.range ? `<path class="rng" d="${opts.range}" stroke-width="${.6*k}"/>` : '';
  const mks = opts.markers.map(m => {
    const [x,y] = proj(m.lat, m.lon);
    const r = (m.num ? 10 : 6.5) * u;
    const shape = m.star ? `<path class="dot" d="${starPath(x, y, r*1.7)}" fill="var(--s${m.score})" stroke-width="${sw}"/>`
                         : `<circle class="dot" cx="${x}" cy="${y}" r="${r}" fill="var(--s${m.score})" stroke-width="${sw}"/>`;
    return `<g class="mk${m.sel?' sel':''}${m.dim?' dim':''}" data-id="${esc(m.id)}" tabindex="0" role="button" aria-label="${esc(m.label)}">
      <circle cx="${x}" cy="${y}" r="${16*u}" fill="transparent"/>${shape}
      ${m.num?`<text x="${x}" y="${y}" font-size="${13*u}">${m.num}</text>`:''}</g>`;
  }).join('');
  return `<svg class="map" viewBox="${vb.join(' ')}" role="img" aria-label="${esc(opts.label)}">
    <path class="grat" d="${GRAT}" stroke-width="${.5*k}"/><path class="land" d="${D.land}"/>${rng}${mks}</svg>`;
}
function bboxOfPath(p){
  const n = (p.match(/-?\d+\.?\d*/g) || []).map(Number); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (let i=0;i+1<n.length;i+=2){ x0=Math.min(x0,n[i]); x1=Math.max(x1,n[i]); y0=Math.min(y0,n[i+1]); y1=Math.max(y1,n[i+1]); }
  return [x0,y0,x1,y1];
}
function legendHtml(withStar){
  return `<div class="maplegend"><span>${esc(T(U.legend))}</span>${[5,4,3,2,1].map(n=>`<span><i style="--c:var(--s${n})"></i>${n}</span>`).join('')}${withStar?`<span style="color:var(--ink)">${STAR}<span style="color:var(--muted)">${esc(T(U.topStar))}</span></span>`:''}</div>`;
}
function bindMarkers(root, fn){
  root.querySelectorAll('.mk').forEach(g => { g.onclick = () => fn(g.dataset.id); g.onkeydown = e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); fn(g.dataset.id); } }; });
}

/* ---------- navigatie ---------- */
const NAV = [['soorten','navSpecies'],['topspots','navTop'],['europa','navEur']];
const MORE = [['verantwoord','navResp'],['paklijst','navPack'],['over','navAbout']];
function renderChrome(route){
  document.documentElement.lang = L;
  document.title = route.title ? `${route.title} · ${T(U.title)}` : T(U.title);
  $('#brandName').textContent = L === 'nl' ? 'Spottersgids' : "Spotter's Guide";
  $('#brandSub').textContent = T(U.brandSub);
  const link = ([id,k]) => `<a href="#${id}"${route.nav===id?' aria-current="page"':''}>${esc(T(U[k]))}</a>`;
  const inMore = MORE.some(([id]) => id === route.nav);
  $('#nav').innerHTML = NAV.map(link).join('') +
    `<div class="more" id="more"><button type="button" class="morebtn${inMore?' cur':''}" id="moreBtn" aria-expanded="false" aria-haspopup="true">${esc(T(U.navMore))}<svg viewBox="0 0 10 10"><path d="M1.5 3.5 5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
     <div class="moremenu"><span class="lbl mlbl">${esc(T(U.navMore))}</span>${MORE.map(link).join('')}</div></div>`;
  $('#moreBtn').onclick = e => { e.stopPropagation(); const o = $('#more').classList.toggle('open'); $('#moreBtn').setAttribute('aria-expanded', o); };
  $('#langNl').setAttribute('aria-pressed', L==='nl'); $('#langEn').setAttribute('aria-pressed', L==='en');
  $('#foot').innerHTML = `<p style="max-width:36rem">${esc(T(U.footMade))}</p><nav>${[...NAV, ...MORE].map(([id,k])=>`<a href="#${id}">${esc(T(U[k]))}</a>`).join('')}</nav>`;
  const h = $('.top').offsetHeight; if (h) document.documentElement.style.setProperty('--head', h + 'px');
}
document.addEventListener('click', e => { const m = $('#more'); if (m && !m.contains(e.target)) { m.classList.remove('open'); } });
$('#menuBtn').onclick = () => { const o = $('#nav').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', o); };
$('#nav').addEventListener('click', e => { if (e.target.closest('a')) { $('#nav').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', false); } });
$$('.lang button').forEach(b => b.onclick = () => { L = b.dataset.l; try { localStorage.setItem('sg-lang', L); } catch(e) {} route(true); });

/* ---------- startpagina ---------- */
function inFilter(cont){ return FILTER === 'all' || cont === FILTER; }
function topspotList(){
  const list = [];
  SPOTS.forEach(s => { if (!inFilter(s.cont)) return;
    const recs = s.recs.filter(r => r.top).sort((a,b) => b.score - a.score || a.no - b.no);
    if (recs.length) list.push({s, r:recs[0], recs}); });
  list.sort((a,b) => b.r.score - a.r.score || CONTS.indexOf(a.s.cont) - CONTS.indexOf(b.s.cont) || a.r.no - b.r.no);
  return list;
}
function catsInFilter(){ return CATS.filter(c => FILTER === 'all' || c.cont.includes(FILTER)); }
function tabCount(t){
  if (t === 'topspots') return topspotList().length;
  if (t === 'kaart') return CAT ? catSpots(CAT).length : SPOTS.filter(s => inFilter(s.cont)).length;
  return catsInFilter().length;
}
function topsHtml(){
  const list = topspotList();
  if (!list.length) return `<p class="empty">${esc(L==='nl'?'Geen topspots in dit werelddeel.':'No top spots on this continent.')}</p>`;
  const shown = SHOWALL ? list : list.slice(0, 6);
  return `<div class="tops">${shown.map(({s,r,recs}) => { const c = BY[r.no];
    return `<button type="button" class="tcard" data-spot="${esc(s.id)}" data-no="${r.no}">
      <div class="ph">${img(c.photos[0], catName(c))}<span class="tag">${esc(contName(s.cont))}</span></div>
      <div class="bd"><span class="sp">${recs.map(x => esc(catName(BY[x.no]))).join(' · ')}</span><h3>${esc(T(s.name))}</h3><span class="where">${esc(T(s.country))}</span>
      ${scoreHtml(r.score)}<span class="ssn">${esc(T(r.season))}</span></div></button>`; }).join('')}</div>
    ${list.length > 6 ? `<div class="morewrap"><button type="button" class="btn" id="showAll">${esc(SHOWALL ? T(U.showLess) : `${T(U.showAll)} (${list.length})`)}</button></div>` : ''}
    <details class="box" style="margin-top:22px"><summary style="cursor:pointer;font-weight:700">${esc(T(U.scaleTitle))}</summary>
    <ul class="scale">${[5,4,3,2,1].map(n=>`<li>${scoreHtml(n)}<span>${esc(T(U.scale[n]))}</span></li>`).join('')}</ul></details>`;
}
function panelHtml(){
  const s = SEL && SPOT[SEL];
  if (!s) return `<p class="hint">${esc(T(U.mapHint))}</p>`;
  const recs = s.recs.slice().sort((a,b)=>b.score-a.score);
  // soorten met precies dezelfde uitleg (uit één topspot) samen tonen
  const groups = [];
  recs.forEach(r => { const g = groups.find(x => T(x[0].why) === T(r.why)); if (g) g.push(r); else groups.push([r]); });
  return `<h3>${esc(T(s.name))}</h3><p class="meta">${esc(placeLine(s))}</p>
    ${groups.map(g => `<div class="rec">${g.map(r => `<div class="sp">${esc(catName(BY[r.no]))} ${scoreHtml(r.score)}</div>`).join('')}
      <p>${esc(T(g[0].why))}</p>${factsHtml(g[0])}
      ${g.map(r => `<p>${PAGES[r.no] ? `<a class="btnlink" href="#soort-${r.no}">${esc(catName(BY[r.no]))}: ${esc(T(U.toPage).toLowerCase())} →</a>` : `<span class="soon">${esc(catName(BY[r.no]))} · ${esc(T(U.soonPage))}</span>`}</p>`).join('')}</div>`).join('')}`;
}
// plekken van één kat binnen het gekozen werelddeel
const catSpots = no => SPOTS.filter(s => inFilter(s.cont) && s.recs.some(r => r.no === no));
// katten in de fotorij: met plek in dit werelddeel (kleur) en zonder plek maar wel levend hier (grijs)
function rowCats(){
  const lives = CATS.filter(c => FILTER === 'all' || c.cont.includes(FILTER) || catSpots(c.no).length);
  const withSpot = lives.filter(c => catSpots(c.no).length), grey = lives.filter(c => !catSpots(c.no).length);
  return {withSpot, grey, total: lives.length};
}
function catRowHtml(){
  const {withSpot, grey, total} = rowCats();
  const btn = (c, g) => `<button type="button" class="catbtn${g?' grey':''}" data-cat="${c.no}" aria-pressed="${CAT===c.no}"><span class="av">${img(c.photos[0], '')}</span>${esc(catName(c))}</button>`;
  const n = CAT ? catSpots(CAT).length : 0;
  return `<p class="lbl" style="margin-bottom:6px">${esc(T(U.catMap))}</p><div class="catrow" id="catrow">
    <button type="button" class="catbtn" data-cat="" aria-pressed="${!CAT}"><span class="av" style="background:var(--olive)">${total}</span>${esc(T(U.allCats))}</button>
    ${withSpot.map(c => btn(c, false)).join('')}${grey.map(c => btn(c, true)).join('')}</div>
    ${CAT ? `<div class="catnote"><b>${esc(catName(BY[CAT]))}</b><span class="lat">${esc(BY[CAT].la)}</span>${n ? `<span class="note">${n} ${esc(n === 1 ? T(U.catShown1) : T(U.catShown))}</span>` : `<span class="soon">${esc(T(U.noSpot))}</span>`}${PAGES[CAT] ? `<a class="btnlink" href="#soort-${CAT}">${esc(T(U.toPage))} →</a>` : (n ? `<span class="soon">${esc(T(U.soonPage))}</span>` : '')}</div>` : ''}`;
}
function mapTabHtml(){
  return `${catRowHtml()}<p class="note" style="margin-bottom:12px">${esc(T(U.mapSub))}</p>
    <div class="mapbox"><div id="mapwrap"></div>${legendHtml(true)}<div class="panel" id="panel" aria-live="polite">${panelHtml()}</div></div>`;
}
function drawHomeMap(){
  const mw = $('#mapwrap'); if (!mw) return;
  const keep = mw.scrollLeft, world = FILTER === 'all' && !CAT;
  mw.className = 'mapscroll' + (world ? ' world' : '');
  const cw = world && narrow() ? 680 : (mw.clientWidth || 360);
  let markers, box = BOX[FILTER], range = null;
  if (CAT) {   // één kat: alleen zijn plekken, kleur = kans voor die kat, met leefgebied
    markers = catSpots(CAT).map(s => ({s, r:s.recs.find(r => r.no === CAT)})).map(({s,r}) => ({id:s.id, lat:s.lat, lon:s.lon, score:r.score, star:r.top, sel:SEL===s.id, label:`${T(s.name)}, ${T(s.country)}`}));
    range = BY[CAT].range || null;
    let [x0,y0,x1,y1] = range ? bboxOfPath(range) : [720,284,0,0];
    markers.forEach(m => { const [x,y] = proj(m.lat, m.lon); x0=Math.min(x0,x); x1=Math.max(x1,x); y0=Math.min(y0,y); y1=Math.max(y1,y); });
    box = FILTER === 'all' ? [x0-12, y0-12, Math.max(60, x1-x0+24), Math.max(36, y1-y0+24)] : BOX[FILTER];
  } else {
    markers = SPOTS.filter(s => inFilter(s.cont)).map(s => ({id:s.id, lat:s.lat, lon:s.lon, score:spotMax(s), star:isTop(s), sel:SEL===s.id, label:`${T(s.name)}, ${T(s.country)}`}));
  }
  markers.sort((a,b) => (a.sel - b.sel) || (a.score - b.score));
  mw.innerHTML = mapSvg({box, world, cw, markers, range, label:T(U.navMap)});
  if (world && mw.scrollWidth > mw.clientWidth) mw.scrollLeft = keep || (mw.scrollWidth - mw.clientWidth) * .55;
  bindMarkers(mw, id => { SEL = id; drawHomeMap(); const p = $('#panel'); p.innerHTML = panelHtml(); p.scrollIntoView({block:'nearest', behavior:'smooth'}); });
}
function speciesTabHtml(){
  return `<input class="search" id="q" type="search" placeholder="${esc(T(U.search))}" value="${esc(Q)}" autocomplete="off" spellcheck="false" enterkeyhint="search"><div id="splist">${speciesListHtml()}</div>`;
}
function speciesListHtml(){
  const q = Q.trim().toLowerCase();
  const cats = catsInFilter().filter(c => !q || [c.nl, c.en, c.la].some(x => x.toLowerCase().includes(q)));
  if (!cats.length) return `<p class="empty">${esc(T(U.noHits))}</p>`;
  const ready = cats.filter(c => PAGES[c.no]), later = cats.filter(c => !PAGES[c.no]);
  let h = '';
  if (ready.length) h += `<div class="grouph"><h3>${esc(T(U.ready))}</h3><span>${ready.length}</span></div><div class="grid">${ready.map(c => `<a class="scard" href="#soort-${c.no}">
      <div class="ph">${img(c.photos[0], catName(c))}</div><div class="bd"><span class="no">№ ${c.no}</span><span class="nm">${esc(catName(c))}</span><span class="la lat">${esc(c.la)}</span>
      <span class="ft">${BEST[c.no] ? scoreHtml(BEST[c.no], false, true) : ''}</span></div></a>`).join('')}</div>`;
  if (later.length) h += `<div class="grouph"><h3>${esc(T(U.soon))}</h3><span>${later.length}</span></div><ul class="soonlist">${later.map(c => `<li>
      ${img(c.photos[0], catName(c))}<div><b>${esc(catName(c))}</b><span class="la lat">${esc(c.la)}</span></div>${BEST[c.no] ? scoreHtml(BEST[c.no], false, true) : '<span></span>'}</li>`).join('')}</ul>`;
  return h;
}
function tabBody(){
  if (TAB === 'kaart') return mapTabHtml();
  if (TAB === 'soorten') return speciesTabHtml();
  return `<p class="note" style="margin-bottom:14px">${esc(T(U.topSub))}</p><div id="tops">${topsHtml()}</div>`;
}
function renderBar(){
  const tabs = [['kaart','navMap'],['topspots','navTop'],['soorten','navSpecies']];
  return `<div class="chips" role="group" aria-label="${esc(L==='nl'?'Filter per werelddeel':'Filter by continent')}">
    ${['all',...CONTS].map(c => `<button type="button" class="chip" data-f="${c}" aria-pressed="${FILTER===c}">${esc(c==='all'?T(U.all):contName(c))}</button>`).join('')}</div>
    <div class="tabs" role="tablist">${tabs.map(([t,k]) => `<button type="button" class="tab" role="tab" data-t="${t}" aria-selected="${TAB===t}">${esc(T(U[k]))}<small>${tabCount(t)}</small></button>`).join('')}</div>`;
}
function renderHome(){
  $('#main').innerHTML = `
  <section class="intro"><div class="wrap"><h1>${esc(T(U.title))}</h1><p class="sub">${esc(T(U.sub))}</p></div></section>
  <div class="bar"><div class="wrap" id="bar">${renderBar()}</div></div>
  <section class="sec" style="padding-top:18px"><div class="wrap" id="tabbody">${tabBody()}</div></section>`;
  bindHome();
}
function refreshHome(){ $('#bar').innerHTML = renderBar(); $('#tabbody').innerHTML = tabBody(); bindHome(); }
function bindHome(){
  $$('.chip[data-f]').forEach(b => b.onclick = () => {
    FILTER = b.dataset.f; CAT = null; try { localStorage.setItem('sg-cont', FILTER); } catch(e) {}
    if (SEL && SPOT[SEL] && !inFilter(SPOT[SEL].cont)) SEL = null;
    refreshHome();
  });
  $$('.tab').forEach(b => b.onclick = () => {
    TAB = b.dataset.t; try { history.replaceState(null, '', '#' + TAB); } catch(e) {}
    refreshHome(); renderChrome({nav: TAB === 'kaart' ? '' : TAB});
    const bar = $('.bar'); if (bar && bar.getBoundingClientRect().top < 0) window.scrollTo(0, $('.intro').offsetHeight);
  });
  $$('.tcard').forEach(b => b.onclick = () => {
    const no = +b.dataset.no;
    if (PAGES[no]) { location.hash = 'soort-' + no; return; }
    SEL = b.dataset.spot; TAB = 'kaart'; try { history.replaceState(null, '', '#kaart'); } catch(e) {}
    refreshHome(); renderChrome({nav:''}); window.scrollTo(0, $('.intro').offsetHeight);
  });
  $$('.catbtn').forEach(b => b.onclick = () => {
    CAT = b.dataset.cat ? +b.dataset.cat : null;
    if (SEL && CAT && !SPOT[SEL].recs.some(r => r.no === CAT)) SEL = null;
    const x = $('#catrow').scrollLeft; refreshHome(); const cr = $('#catrow'); if (cr) cr.scrollLeft = x;
  });
  const sa = $('#showAll'); if (sa) sa.onclick = () => { SHOWALL = !SHOWALL; $('#tops').innerHTML = topsHtml(); bindHome(); };
  const q = $('#q'); if (q) q.oninput = () => { Q = q.value; $('#splist').innerHTML = speciesListHtml(); };
  drawHomeMap();
}
let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if ($('#mapwrap')) drawHomeMap(); if ($('#spmap')) drawSpeciesMap(); }, 200); });

/* ---------- soortpagina ---------- */
let SPMAP = null;
function drawSpeciesMap(){
  const el = $('#spmap'); if (!el || !SPMAP) return;
  el.innerHTML = mapSvg({...SPMAP, cw: el.clientWidth || 360});
  bindMarkers(el, id => { const d = document.getElementById('plek-' + id); if (d) { d.open = true; d.scrollIntoView({block:'start', behavior:'smooth'}); } });
}
function renderSpecies(no){
  const c = BY[no], P = PAGES[no];
  if (!c || !P) return renderMissing(c);
  const recs = P.spots.map(id => { const s = SPOT[id]; return {s, r:s.recs.find(r => r.no === no)}; });
  const local = {}; P.sources.forEach((g,i) => local[g] = i+1);
  const cite = ids => (ids||[]).filter(g => local[g]).map(g => `<a class="cite" href="#bron-${no}-${local[g]}">[${local[g]}]</a>`).join('');
  const top = recs[0], best = top.r.score;
  let [x0,y0,x1,y1] = c.range ? bboxOfPath(c.range) : [720,284,0,0];
  recs.forEach(({s}) => { const [x,y] = proj(s.lat, s.lon); x0=Math.min(x0,x); x1=Math.max(x1,x); y0=Math.min(y0,y); y1=Math.max(y1,y); });
  const pad = 12;
  SPMAP = {box:[x0-pad, y0-pad, Math.max(50, x1-x0+2*pad), Math.max(30, y1-y0+2*pad)], range:c.range,
    markers: recs.map(({s,r},i) => ({id:s.id, lat:s.lat, lon:s.lon, score:r.score, num:i+1, label:`${i+1}. ${T(s.name)}`})).reverse(),
    label: T(U.habitat)+': '+catName(c)};
  const intro = T(P.intro), km = intro.match(/(Kans|Chance):\s*\d.*$/s);
  const story = km ? intro.slice(0, km.index).trim() : intro;
  const season1 = T(top.r.season).split(/;\s*|\s\(/)[0];
  $('#main').innerHTML = `
  <div class="wrap"><p class="crumbs"><a href="#soorten">← ${esc(T(U.back))}</a></p>
  <section class="sphead">
    <figure class="hero"><div class="ph">${img(c.photos[0], catName(c), true)}</div><figcaption>${credit(c.photos[0].cr)}</figcaption></figure>
    <div class="idblock">
      <span class="lbl">№ ${c.no} · ${c.cont.map(contName).join(' · ')}</span>
      <h1>${esc(catName(c))}</h1>
      <p class="en">${esc(L==='nl'?c.en:c.nl)} · <span class="lat">${esc(c.la)}</span></p>
      <div class="badges">${iucnHtml(c.iucn)}</div>
      <dl class="summary">
        <div><dt>${esc(T(U.bestPlace))}</dt><dd>${esc(T(top.s.name))}<small>${esc(T(top.s.country))}</small></dd></div>
        <div><dt>${esc(T(U.bestTime))}</dt><dd>${esc(season1)}</dd></div>
        <div><dt>${esc(T(U.chance))}</dt><dd>${scoreHtml(best)}</dd></div>
      </dl>
      <p class="lead">${esc(story)}${km ? `<span class="kans">${esc(km[0])}</span>` : ''}</p>
    </div>
  </section></div>
  <nav class="jump" aria-label="${esc(L==='nl'?'Snel naar':'Jump to')}"><div class="wrap">
    ${[['plekken','jPlaces'],['kaartsec','jMap'],['tipssec','jTips'],['statussec','jStatus'],['bronnen','jSources']].map(([id,k]) => `<button type="button" data-go="${id}">${esc(T(U[k]))}</button>`).join('')}
  </div></nav>
  <div class="wrap">
  <section class="sec anchor" id="plekken"><div class="sechead"><h2>${esc(T(U.bestSpots))}</h2><p>${esc(T(U.bestSpotsSub))}</p></div>
    <ol class="spots">${recs.map(({s,r},i) => `<li><details class="spot" id="plek-${esc(s.id)}" style="--c:var(--s${r.score})"${i<3?' open':''}>
      <summary><span class="rank">${i+1}</span><span class="tt"><h3>${esc(T(s.name))}</h3><span class="where">${esc(T(s.country))}</span></span><span class="sc-sum">${scoreHtml(r.score, false, true)}</span>${CHEV}</summary>
      <div class="body"><p class="where">${esc(T(s.area))}</p>${scoreHtml(r.score)}
      <p class="why">${esc(T(r.why))}${cite(r.src)}</p>${factsHtml(r)}</div></details></li>`).join('')}</ol></section>
  <section class="sec anchor" id="kaartsec"><div class="sechead"><h2>${esc(T(U.habitat))}</h2></div>
    <div class="mapbox">${alsoHtml(no, recs)}<div id="spmap"></div>${legendHtml(false)}<div class="panel"><p class="note">${esc(T(U.habitatNote))}</p></div></div></section>
  <section class="sec two">
    <div class="anchor" id="tipssec"><h2>${esc(T(U.tips))}</h2><ul class="tips" style="margin-top:14px">${T(P.tips).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="anchor" id="statussec"><h2>${esc(T(U.status))}</h2><div class="box" style="margin-top:14px;display:grid;gap:12px">
      <div>${iucnHtml(c.iucn)}</div><p>${esc(T(P.status))}${cite(P.statusSrc)}</p>
      <h3>${esc(T(U.threats))}</h3><ul class="tips">${T(P.threats).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
  </section>
  ${c.photos.length > 1 ? `<section class="sec"><h2 style="margin-bottom:14px">${esc(T(U.photos))}</h2><div class="gallery">${c.photos.slice(1).map(p => `<figure><div class="ph">${img(p, catName(c))}</div><figcaption>${credit(p.cr)}</figcaption></figure>`).join('')}</div></section>` : ''}
  <section class="sec read anchor" id="bronnen"><h2 style="margin-bottom:14px">${esc(T(U.sources))}</h2>
    <ol class="sources">${P.sources.map((g,i) => `<li id="bron-${no}-${i+1}"><a href="${esc(SRC[g].url)}" target="_blank" rel="noopener">${esc(T(SRC[g].title))}</a></li>`).join('')}</ol>
    <p class="note" style="margin-top:14px">${esc(L==='nl'?'Foto’s, leefgebied en IUCN-status: De KATalogue.':'Photos, range and IUCN status: De KATalogue.')}</p></section>
  </div>`;
  drawSpeciesMap(); bindAlso(no, recs);
  $$('.jump button').forEach(b => b.onclick = () => { const el = document.getElementById(b.dataset.go); if (el) el.scrollIntoView({block:'start', behavior:'smooth'}); });
  $$('.cite').forEach(a => a.onclick = e => { e.preventDefault(); const el = document.getElementById(a.getAttribute('href').slice(1)); if (el) { el.scrollIntoView({block:'center', behavior:'smooth'}); el.style.background='color-mix(in srgb,var(--accent) 18%,transparent)'; setTimeout(()=>el.style.background='',1600); } });
  return catName(c);
}
// andere katten die op dezelfde plekken voorkomen
function alsoCats(no, recs){
  const set = {};
  recs.forEach(({s}) => s.recs.forEach(r => { if (r.no !== no) set[r.no] = true; }));
  return Object.keys(set).map(Number).sort((a,b) => a - b);
}
function alsoHtml(no, recs){
  const list = alsoCats(no, recs); if (!list.length) return '';
  return `<div class="also"><label for="alsoSel">${esc(T(U.alsoLbl))}</label><select id="alsoSel"><option value="">${esc(T(U.alsoNone))}</option>${list.map(n => `<option value="${n}"${ALSO===n?' selected':''}>${esc(catName(BY[n]))}</option>`).join('')}</select><div id="alsoOut" style="flex-basis:100%"></div></div>`;
}
function bindAlso(no, recs){
  const sel = $('#alsoSel'); if (!sel) return;
  const base = SPMAP.markers.map(m => ({...m}));
  const apply = () => {
    const a = sel.value ? +sel.value : null; ALSO = a;
    if (!a) { SPMAP.markers = base; $('#alsoOut').innerHTML = ''; drawSpeciesMap(); return; }
    SPMAP.markers = base.map(m => { const r = SPOT[m.id].recs.find(x => x.no === a); return r ? {...m, score:r.score} : {...m, dim:true}; });
    const shared = recs.map(({s}) => ({s, r:s.recs.find(x => x.no === a)})).filter(x => x.r);
    $('#alsoOut').innerHTML = `<p class="note" style="margin-top:6px">${esc(catName(BY[a]))} ${esc(T(U.alsoAt))}</p><ul class="alsolist">${shared.map(({s,r}) => `<li><b>${esc(T(s.name))}</b>${scoreHtml(r.score, false, true)}</li>`).join('')}</ul>
      <p style="margin-top:8px">${PAGES[a] ? `<a class="btnlink" href="#soort-${a}">${esc(catName(BY[a]))}: ${esc(T(U.toPage).toLowerCase())} →</a>` : `<span class="soon">${esc(T(U.soonPage))}</span>`}</p>`;
    drawSpeciesMap();
  };
  sel.onchange = apply; if (ALSO && alsoCats(no, recs).includes(ALSO)) apply(); else ALSO = null;
}
function renderMissing(c){
  $('#main').innerHTML = `<div class="wrap sec read"><h1>${esc(c ? catName(c) : '404')}</h1><p style="margin-top:12px">${esc(c ? T(U.soonPage) + '.' : T(U.notFound))}</p><p style="margin-top:16px"><a class="btnlink" href="#soorten">← ${esc(T(U.back))}</a></p></div>`;
  return c ? catName(c) : '';
}

/* ---------- tekstpagina's ---------- */
function renderText(id){
  const pg = D.text[id];
  let html = `<div class="wrap sec"><div class="read prose"><span class="lbl">${esc(T(pg.eyebrow))}</span><h1>${esc(T(pg.title))}</h1>${T(pg.html)}`;
  if (id === 'europa') html += europaList();
  if (id === 'over') html += `<p><a class="kofi" href="${esc(KOFI_URL)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 6h13a4 4 0 0 1 0 8h-1.1A6 6 0 0 1 10 19H9a5 5 0 0 1-5-5V6zm12 2v4h1a2 2 0 0 0 0-4h-1z"/></svg>${esc(L==='nl'?'Trakteer me op een koffie (Ko-fi)':'Buy me a coffee (Ko-fi)')}</a></p>`;
  if (pg.sources && pg.sources.length) html += `<h2>${esc(T(U.sources))}</h2><ol class="sources">${pg.sources.map(g => `<li><a href="${esc(SRC[g].url)}" target="_blank" rel="noopener">${esc(T(SRC[g].title))}</a></li>`).join('')}</ol>`;
  html += `</div></div>`;
  $('#main').innerHTML = html;
  return T(pg.title);
}
function europaList(){
  return `<div class="eurlist">${D.europe.map(e => { const c = BY[e.no], page = PAGES[e.no];
    const inner = `${img(c.photos[0], catName(c))}<div><span class="lbl">${esc(T(e.where))}</span><b style="font-family:var(--display);font-size:1.15rem">${esc(catName(c))}</b><span class="lat">${esc(c.la)}</span>${BEST[e.no]?scoreHtml(BEST[e.no]):''}<span>${esc(T(e.text))}</span></div>`;
    return page ? `<a class="eurrow" href="#soort-${e.no}">${inner}</a>` : `<div class="eurrow">${inner}</div>`; }).join('')}</div>`;
}

/* ---------- router ---------- */
function route(keep){
  const h = (location.hash || '#start').slice(1);
  let title = '', nav = '';
  const y = window.scrollY;
  if (h === 'start' || h === '' || h === 'topspots' || h === 'kaart' || h === 'soorten') {
    if (h !== 'start' && h !== '') TAB = h;
    nav = TAB === 'kaart' ? '' : TAB; renderHome();
  }
  else if (/^soort-\d+$/.test(h)) { nav = 'soorten'; title = renderSpecies(+h.slice(6)); }
  else if (D.text[h]) { nav = h; title = renderText(h); }
  else { title = renderMissing(null); }
  renderChrome({title, nav});
  window.scrollTo(0, keep ? y : 0);
  if (keep) { drawHomeMap(); drawSpeciesMap(); }
}
window.addEventListener('hashchange', () => route(false));
route(false);
})();
</script>
